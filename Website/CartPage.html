                </a>
                <ul class="nav-links">
                    <li><a href="HomePage.html">Home</a></li>
                    <li><a href="AboutUs.html">About Us</a></li>
                    <li><a href="ProductPage.html">Products</a></li>

                </ul>
            </div>
        </nav>
    </header>
    <main>
        <h2>Shopping Cart</h2>
        <div class="cart-items">
            <div class="cart-item">
                <img src="../Images/Computer cases/694750680054530490.jpg" alt="Product 1" width="100" height="100">
                <p>Product 1</p>
                <p>Quantity: 1</p>
                <p>Price: $100</p>
            </div>
            <div class="cart-item">
                <img src="../Images/Computer cases/KOLINK Observatory RGB Midi-Tower Computergehäuse….jpg" alt="Product 2" width="100" height="100">
                <p>Product 2</p>
                <p>Quantity: 2</p>
                <p>Price: $200</p>
            </div>
            
      
    </main>

        <main>
        <div class="cart">
            <div class="Cart-header">
                <div class="go-back"><i class = "fas fa-chevron-left"></i></div>
                <div class= "cart-title">My Cart</div>
            </div>
            <div class="Cart-Item">
               <div class="item img" style="background-image: url(/Images/Custome\ KeyBoard.jpg);"></div> 
               
                <div class="item details">

                    <div class="item-name">Custom Keyboard</div>
                    <div class="item-price">R 1,500.00</div>

                    <div class="item-quantity">
                        <span class="input-btn"><i class="fas fa-minus"></i></span>
                        <input type="number" min="1" value="1"> 
                        <span class="input-btn"><i class="fas fa-plus"></i></span>
                    </div>
                </div>

                <div class = "cart-footer">
                    <div class="total">Total: R 1,500.00</div>
                    <button class="checkout-btn">Checkout</button>
                </div>
               
            </div>

        </div>
                
    
    </main>
</body>
