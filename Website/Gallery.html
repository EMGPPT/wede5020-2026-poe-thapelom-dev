    <link rel="stylesheet" href="../CSS Folder/Page.css">
    <link rel="stylesheet" href="../CSS Folder/Gallery.css">
    <link rel="stylesheet" href="../CSS Folder/Format.css">
    <script defer src="../Website/lightbox/lightbox.js"></script>
</head>
<body>
      <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="brand" aria-label="UVIEW home">
                    <img src="../Images/Logo/UVIEW.png" alt="UVIEW logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="AboutUs.html">About Us</a></li>
                    <li><a href="ProductPage.html">Products</a></li>
                    <li><a href="Gallery.html" class="active" aria-current="page">Gallery</a></li>
                    <li><a href="Contact.html">Contact Us</a></li>
                    <li><a href="CartPage.html">Cart</a></li>

                    <li><button class="account-btn secondary" type="button">Sign Up</button></li>
                </ul>
            </div>
        </nav>
    </header>

        <!-- Images used to open the lightbox -->
<main class="gallery-container">
  <img src="../Images/Custome KeyBoard.jpg" alt="Custom keyboard">
  <img src="../Images/Custome Keyboard2.webp" alt="Custom keyboard 2">
  <img src="../Images/Custome keyboard3.webp" alt="Custom keyboard 3">
  <img src="../Images/REdDragonKeyboard.jpg" alt="Red Dragon keyboard">
</main>

<!-- The Modal/Lightbox -->
<div id="lightbox" class="lightbox">
    <div class="lightbox__inner">
      <button class="lightbox__close" id="lightbox-close">&times;</button>
      <img id ="lightbox-img" alt="Expanded View" class="lightbox__image">
    </div>
</div>

    <!-- Next/previous controls -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <!-- Caption text -->
    <div class="caption-container">
      <p id="caption"></p>
    </div>


<footer id="footer">

</footer>
</body>
</html>
