    <link rel="stylesheet" href="../CSS Folder/Format.css">

</head>
<body>
      <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="brand" aria-label="UVIEW home">
                    <img src="../Images/Logo/UVIEW.png" alt="UVIEW logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="AboutUs.html">About Us</a></li>

                </ul>
            </div>
        </nav>

        <!-- Images used to open the lightbox -->
<main class="gallery-container">
  <img src="../Images/Custome KeyBoard.jpg" alt="Custom keyboard">
  <img src="../Images/Custome Keyboard2.webp" alt="Custom keyboard 2">
  <img src="../Images/Custome keyboard3.webp" alt="Custom keyboard 3">
  <img src="../Images/REdDragonKeyboard.jpg" alt="Red Dragon keyboard">
</main>

<!-- The Modal/Lightbox -->
<div id="myModal" class="modal">
  <span class="close cursor" onclick="closeModal()">&times;</span>
  <div class="modal-content">

    <div class="mySlides">
      <div class="numbertext">1 / 4</div>
      <img src="../Images/Custome KeyBoard.jpg" style="width:100%">
    </div>

    <div class="mySlides">
      <div class="numbertext">2 / 4</div>
      <img src="../Images/Custome Keyboard2.webp" style="width:100%">
    </div>

    <div class="mySlides">
      <div class="numbertext">3 / 4</div>
        <img src="../Images/Custome keyboard3.webp" style="width:100%">
      </div>

    <div class="mySlides">
      <div class="numbertext">4 / 4</div>
      <img src="../Images/REdDragonKeyboard.jpg" style="width:100%">
    </div>

    <!-- Next/previous controls -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <!-- Caption text -->
    <div class="caption-container">
      <p id="caption"></p>
    </div>

    <!-- Thumbnail image controls -->
    <div class="column">
      <img class="demo" src="../Images/Custome KeyBoard.jpg" onclick="currentSlide(1)" alt="Nature">
    </div>

    <div class="column">
      <img class="demo" src="../Images/Custome Keyboard2.webp" onclick="currentSlide(2)" alt="Snow">
    </div>

    <div class="column">
      <img class="demo" src="../Images/Custome keyboard3.webp" onclick="currentSlide(3)" alt="Mountains">
    </div>

    <div class="column">
      <img class="demo" src="../Images/REdDragonKeyboard.jpg" onclick="currentSlide(4)" alt="Lights">
    </div>
  </div>
</div>

<footer id="footer">

</footer>
</body>
</html>
